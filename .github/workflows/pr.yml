name: .dotfiles PR

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:

jobs:
  check:
    name: pre-commit
    runs-on: ubuntu-latest
    env:
      DOTFILES_CI: 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-5|${{ runner.os }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv tool run pre-commit run --all-files

  templates:
    name: templates on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install chezmoi and linters
        run: |
          set -eu
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"
          if ! command -v shellcheck >/dev/null 2>&1; then
            brew install shellcheck
          fi

      - name: Render and lint templates
        env:
          DOTFILES_LOCATION: ${{ github.workspace }}
        run: uv run --no-project --with pyyaml -- ./scripts/test-templates.sh

      - name: Validate profiles
        env:
          DOTFILES_LOCATION: ${{ github.workspace }}
        run: ./scripts/test-profiles.sh

      - name: Validate LLM configuration
        env:
          DOTFILES_LOCATION: ${{ github.workspace }}
        run: ./scripts/test-llm-config.sh

  install-linux:
    needs: [check, templates]
    name: install on ${{ matrix.image }} / ${{ matrix.profiles }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu/Debian: workstation and headless role coverage.
          - image: ubuntu:26.04
            profiles: workstation,development,owned
          - image: ubuntu:latest
            profiles: workstation,development,owned
          - image: debian:13
            profiles: headless,server,owned
          - image: debian:sid
            profiles: headless,development

          # Fedora: owned workstation, headless server, and gaming coverage.
          - image: fedora:latest
            profiles: workstation,development,owned
          - image: fedora:latest
            profiles: headless,server,owned
          - image: fedora:latest
            profiles: workstation,development,gaming,server,owned

          # Arch/CachyOS: rolling workstation/development coverage.
          - image: archlinux:latest
            profiles: workstation,development,owned
          - image: cachyos/cachyos:latest
            profiles: workstation,development,owned

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run dotfiles install test
        env:
          DOTFILES_CI: 'true'
          DOTFILES_LOCATION: ${{ github.workspace }}
          DOTFILES_PROFILES: ${{ matrix.profiles }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci-test.sh

  install-macos:
    needs: [check, templates]
    name: install on macos:latest / workstation,laptop,development,owned,llm
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run dotfiles install test
        env:
          DOTFILES_CI: 'true'
          DOTFILES_LOCATION: ${{ github.workspace }}
          DOTFILES_PROFILES: workstation,laptop,development,owned,llm
        run: ./scripts/ci-test.sh

  test:
    name: test
    runs-on: ubuntu-latest
    needs:
      - check
      - templates
      - install-linux
      - install-macos
    if: always()

    steps:
      - name: Check required jobs
        run: |-
          set -eu

          check_result='${{ needs.check.result }}'
          templates_result='${{ needs.templates.result }}'
          install_linux_result='${{ needs.install-linux.result }}'
          install_macos_result='${{ needs.install-macos.result }}'

          printf 'check: %s\n' "$check_result"
          printf 'templates: %s\n' "$templates_result"
          printf 'install-linux: %s\n' "$install_linux_result"
          printf 'install-macos: %s\n' "$install_macos_result"

          test "$check_result" = "success"
          test "$templates_result" = "success"
          test "$install_linux_result" = "success"
          test "$install_macos_result" = "success"
