name: .dotfiles nightly

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: '23 2 * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotfiles-nightly
  cancel-in-progress: false

jobs:
  plan:
    name: package coverage and matrix
    runs-on: ubuntu-latest

    outputs:
      linux: ${{ steps.matrix.outputs.linux }}
      macos: ${{ steps.matrix.outputs.macos }}
      degraded: ${{ steps.matrix.outputs.degraded }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: false

      - name: Verify exhaustive package coverage
        run: uv run --with pyyaml python scripts/test-package-coverage.py

      - name: Build matrices
        id: matrix
        run: |
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          data = json.loads(
              Path("scripts/nightly-package-scenarios.json").read_text(
                  encoding="utf-8"
              )
          )

          for key in ("linux", "macos", "degraded"):
              value = {"include": data[key]}
              print(f"{key}={json.dumps(value, separators=(',', ':'))}")
          PY

  profile-render:
    name: nightly / representative profile rendering
    needs: plan
    runs-on: ubuntu-latest

    container:
      image: ubuntu:latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install renderer dependencies
        run: |
          set -eu

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            jq

          sh -c "$(curl -fsLS get.chezmoi.io)" -- \
            -b /usr/local/bin

      - name: Render representative profiles
        env:
          DOTFILES_CI: 'true'
          DOTFILES_LOCATION: ${{ github.workspace }}
        run: ./scripts/test-profiles.sh

  install-linux:
    name: >-
      nightly / ${{ matrix.name }} / ${{ matrix.profiles }} / ${{ matrix.package_mode }}

    needs: plan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Homebrew download cache
        if: >-
          matrix.package_mode == 'linuxbrew' || matrix.package_mode == 'native-linuxbrew'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dotfiles-homebrew-cache
          key: >-
            homebrew-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('home/.chezmoidata/packages.yaml') }}
          restore-keys: |
            homebrew-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install every applicable package
        env:
          DOTFILES_CI: 'true'
          DOTFILES_LOCATION: ${{ github.workspace }}
          DOTFILES_PROFILES: ${{ matrix.profiles }}
          DOTFILES_CI_PACKAGE_MODE: ${{ matrix.package_mode }}
          HOMEBREW_CACHE: ${{ runner.temp }}/dotfiles-homebrew-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci-install.sh

  install-linux-degraded:
    name: nightly degraded / ${{ matrix.name }} / ${{ matrix.profiles }}
    needs: plan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.degraded) }}

    container:
      image: ${{ matrix.image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run install without package access
        env:
          DOTFILES_CI: 'true'
          DOTFILES_LOCATION: ${{ github.workspace }}
          DOTFILES_PROFILES: ${{ matrix.profiles }}
          DOTFILES_CI_PACKAGE_MODE: ${{ matrix.package_mode }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci-install.sh

  install-macos:
    name: >-
      nightly / ${{ matrix.name }} / ${{ matrix.profiles }} / ${{ matrix.package_mode }}

    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.macos) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Homebrew download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dotfiles-homebrew-cache
          key: >-
            homebrew-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('home/.chezmoidata/packages.yaml') }}
          restore-keys: |
            homebrew-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install every applicable package
        env:
          DOTFILES_CI: 'true'
          DOTFILES_LOCATION: ${{ github.workspace }}
          DOTFILES_PROFILES: ${{ matrix.profiles }}
          DOTFILES_CI_PACKAGE_MODE: ${{ matrix.package_mode }}
          HOMEBREW_CACHE: ${{ runner.temp }}/dotfiles-homebrew-cache
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/ci-install.sh

  test:
    name: test
    runs-on: ubuntu-latest

    needs:
      - plan
      - profile-render
      - install-linux
      - install-linux-degraded
      - install-macos

    if: always()

    steps:
      - name: Check required jobs
        run: |-
          set -eu

          plan_result='${{ needs.plan.result }}'
          profile_result='${{ needs.profile-render.result }}'
          install_linux_result='${{ needs.install-linux.result }}'
          degraded_result='${{ needs.install-linux-degraded.result }}'
          install_macos_result='${{ needs.install-macos.result }}'

          printf 'plan: %s\n' "$plan_result"
          printf 'profile-render: %s\n' "$profile_result"
          printf 'install-linux: %s\n' "$install_linux_result"
          printf 'install-linux-degraded: %s\n' "$degraded_result"
          printf 'install-macos: %s\n' "$install_macos_result"

          test "$plan_result" = "success"
          test "$profile_result" = "success"
          test "$install_linux_result" = "success"
          test "$degraded_result" = "success"
          test "$install_macos_result" = "success"
