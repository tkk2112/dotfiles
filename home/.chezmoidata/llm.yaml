llm:
  models:
    - id: qwen2.5-coder-3b
      name: Qwen 2.5 Coder 3B
      kind: generative
      context: 32768
      default_engine: llama_cpp

      engines:
        llama_cpp:
          model: bartowski/Qwen2.5-Coder-3B-GGUF:Q4_K_M

        mlx:
          model: mlx-community/Qwen2.5-Coder-3B-4bit

    - id: laya
      name: Laya
      kind: decision
      context: 512

      engines:
        laya_mlx:
          model: aac6fef/laya-mlx
          dtype: float16
          device: gpu

  runtimes:
    completion:
      feature: completion
      model: qwen2.5-coder-3b
      port: 18080
      autostart: true

    laya:
      feature: laya
      model: laya
      port: 18081
      autostart: false

  defaults:
    completion: completion
    decision: laya
